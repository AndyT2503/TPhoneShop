<div class="auth-layout">
  <div class="auth-banner">
    <div class="banner-circle banner-circle-top"></div>
    <div class="banner-circle banner-circle-bottom"></div>

    <div class="banner-content">
      <div class="banner-logo">
        <svg lucideSmartphone [size]="32" class="text-white"></svg>
      </div>

      <h2 class="banner-title">TPhoneShop</h2>

      <p class="banner-description">
        Hệ thống chuỗi cửa hàng điện thoại & phụ kiện chính hãng hàng đầu Việt
        Nam.
      </p>

      <div class="feature-list">
        <div class="feature-item">🏆 Hàng chính hãng 100%</div>

        <div class="feature-item">💳 Trả góp 0% không lãi suất</div>

        <div class="feature-item">🚚 Giao hàng toàn quốc</div>

        <div class="feature-item">🔒 Bảo mật thông tin tuyệt đối</div>
      </div>
    </div>
  </div>

  <div class="auth-content">
    <a class="back-home-btn" routerLink="/">
      <svg lucideHouse [size]="15"></svg>
      Về trang chủ
    </a>
    <div class="content-wrapper">
      <div class="w-full max-w-sm mx-auto">
        <router-outlet />
      </div>
    </div>
  </div>
</div>
