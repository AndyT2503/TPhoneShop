<div class="min-h-screen flex">
  <div
    class="hidden lg:flex flex-col justify-center items-center flex-1 bg-gradient-to-br from-indigo-600 via-violet-700 to-purple-800 p-12 relative overflow-hidden"
  >
    <div
      class="absolute top-0 left-0 w-64 h-64 bg-white/10 rounded-full -translate-x-1/3 -translate-y-1/3"
    ></div>
    <div
      class="absolute bottom-0 right-0 w-80 h-80 bg-white/10 rounded-full translate-x-1/3 translate-y-1/3"
    ></div>
    <div class="relative text-white text-center max-w-sm">
      <div
        class="w-16 h-16 rounded-2xl bg-white/20 backdrop-blur-sm flex items-center justify-center mx-auto mb-6"
      >
        <svg lucideSmartphone [size]="32" class="text-white"/>
      </div>
      <h2 class="text-3xl font-extrabold mb-4">TPhoneShop</h2>
      <p class="text-white/80 leading-relaxed mb-8">
        Hệ thống chuỗi cửa hàng điện thoại & phụ kiện chính hãng hàng đầu Việt
        Nam.
      </p>
      <div class="space-y-3">
        <div
          class="flex items-center gap-3 text-sm text-white/90 bg-white/10 rounded-xl px-4 py-2.5 text-left"
        >
          🏆 Hàng chính hãng 100%
        </div>
        <div
          class="flex items-center gap-3 text-sm text-white/90 bg-white/10 rounded-xl px-4 py-2.5 text-left"
        >
          💳 Trả góp 0% không lãi suất
        </div>
        <div
          class="flex items-center gap-3 text-sm text-white/90 bg-white/10 rounded-xl px-4 py-2.5 text-left"
        >
          🚚 Giao hàng toàn quốc
        </div>
        <div
          class="flex items-center gap-3 text-sm text-white/90 bg-white/10 rounded-xl px-4 py-2.5 text-left"
        >
          🔒 Bảo mật thông tin tuyệt đối
        </div>
      </div>
    </div>
  </div>
</div>
