services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: tphoneshop-minio
    restart: unless-stopped

    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: 12345678

    command: server /data --console-address ":9001"

    volumes:
      - minio-data:/data

  redis:
    image: redis:8
    container_name: tphoneshop-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: tphoneshop-rabbitmq
    restart: unless-stopped

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  mongodb:
    image: mongo:8
    container_name: tphoneshop-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongodb-data:/data/db

  postgres:
    image: postgres:18
    container_name: tphoneshop-postgres
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: tphoneshop

    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  minio-data:
  redis-data:
  rabbitmq-data:
  mongodb-data:
  postgres-data:
